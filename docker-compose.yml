# Desarrollo local. Backend y frontend corren fuera de Docker:
#   docker compose up -d                       # Postgres (5435) y motor SUNAT (8089)
#   cd apps/backend && npm run dev             # API en http://localhost:4000
#   cd apps/frontend && npm run dev            # Web en http://localhost:3000
# La producción se despliega aparte (Coolify).

# Nombre fijo del proyecto: así el volumen es siempre invoiceapp_invoiceapp-pg, sea cual sea la carpeta.
name: invoiceapp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoiceapp
    volumes:
      - invoiceapp-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoiceapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  sunat-engine:
    build: ./apps/sunat-engine
    restart: unless-stopped
    ports:
      - "8089:80"
    environment:
      ENGINE_TOKEN: ${SUNAT_ENGINE_TOKEN:-dev}

volumes:
  invoiceapp-pg:
