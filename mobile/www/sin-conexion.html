<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- scripts/preparar-www.mjs escribe aquí la URL del build (producción por defecto). -->
  <meta name="facturo-destino" content="https://facturo.gargurevich.dev" />
  <meta name="color-scheme" content="light dark" />
  <title>Sin conexión · Facturo</title>
  <style>
    :root {
      --fondo: #FFFFFF;
      --texto: #1F1F1F;
      --texto-suave: #5C5C63;
      --marca: #6B2C6E;
      --marca-texto: #FFFFFF;
      --tarjeta: #F6F1F7;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --fondo: #161217;
        --texto: #F2EEF3;
        --texto-suave: #B9B0BD;
        --marca: #D7B3D9;
        --marca-texto: #161217;
        --tarjeta: #221B24;
      }
    }
    :root[data-theme="dark"] {
      --fondo: #161217;
      --texto: #F2EEF3;
      --texto-suave: #B9B0BD;
      --marca: #D7B3D9;
      --marca-texto: #161217;
      --tarjeta: #221B24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--fondo); }
    body {
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .marca { width: 56px; height: 56px; margin: 0 auto 20px; display: block; }
    .icono {
      width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 16px;
      background: var(--tarjeta); color: var(--marca);
      display: flex; align-items: center; justify-content: center;
    }
    .icono svg { width: 32px; height: 32px; }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
    p { font-size: 15px; line-height: 1.5; color: var(--texto-suave); margin: 0 0 24px; }
    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--marca);
      color: var(--marca-texto);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <!-- Logo en línea: con server.url, una ruta relativa apunta al dominio y sin red no carga. -->
    <svg class="marca" width="56" height="56" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Facturo">
    <path d="M19 11a8 8 0 0 1 8-8H101a8 8 0 0 1 8 8V115L100 124L91 115L82 124L73 115L64 124L55 115L46 124L37 115L28 124L19 115Z" fill="#6B2C6E"/>
    <rect x="40" y="25" width="12" height="58" rx="3" fill="#FFFFFF"/>
    <rect x="40" y="25" width="44" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="40" y="49" width="31" height="12" rx="3" fill="#FFFFFF"/>
    <circle cx="84" cy="86" r="11" fill="#A866AB"/>
    <rect x="82" y="80" width="4" height="12" rx="2" fill="#6B2C6E"/>
    </svg>
    <div class="icono" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" x2="22" y1="2" y2="22"/>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
        <line x1="12" x2="12.01" y1="20" y2="20"/>
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>Facturo necesita internet para cargar tus comprobantes. Revisa el Wi-Fi o los datos móviles y vuelve a intentarlo.</p>
    <button id="reintentar" type="button">Reintentar</button>
  </main>
  <script>
    (function () {
      var destino = document.querySelector('meta[name="facturo-destino"]').getAttribute('content');
      document.getElementById('reintentar').addEventListener('click', function () {
        window.location.replace(destino);
      });
    })();
  </script>
</body>
</html>
